name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  # Youtube cambia seguido y el .exe congela el yt-dlp del dia del build.
  # Este rebuild mensual reemplaza el binario de la ultima release por uno
  # con el yt-dlp del momento, sin crear un tag nuevo.
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: write

env:
  APP_NAME: download-youtube-script
  # Build LGPL: incluye libmp3lame y es mas simple de redistribuir que la GPL.
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Descargar ffmpeg
        run: |
          curl.exe -L --fail -o ffmpeg.zip "$env:FFMPEG_URL"
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-tmp
          $exe = Get-ChildItem -Path ffmpeg-tmp -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "No se encontro ffmpeg.exe en el zip" }
          Copy-Item $exe.FullName -Destination ffmpeg.exe
          Write-Host "ffmpeg.exe: $([math]::Round((Get-Item ffmpeg.exe).Length / 1MB)) MB"

      - name: Construir el ejecutable
        run: |
          # mutagen se importa de forma condicional dentro de yt-dlp; se declara
          # explicito para que PyInstaller no lo deje afuera del bundle.
          pyinstaller --onefile --clean `
            --name "$env:APP_NAME" `
            --icon icon.ico `
            --add-binary "ffmpeg.exe;." `
            --hidden-import mutagen `
            index.py

      - name: Verificar el ejecutable
        run: |
          $exe = "dist\$env:APP_NAME.exe"
          if (-not (Test-Path $exe)) { throw "No se genero $exe" }
          Write-Host "$exe : $([math]::Round((Get-Item $exe).Length / 1MB)) MB"
          # Corre el self-check adentro del .exe: resuelve el ffmpeg embebido y
          # codifica un mp3 de prueba. Si falla, no se publica la release.
          & $exe --check
          if ($LASTEXITCODE -ne 0) { throw "El self-check del ejecutable fallo" }

      - name: Publicar artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}
          path: dist/${{ env.APP_NAME }}.exe
          if-no-files-found: error

      - name: Crear la release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "dist\$env:APP_NAME.exe" `
            --title "$env:GITHUB_REF_NAME" `
            --generate-notes

      - name: Refrescar el binario de la ultima release
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release list --limit 1 --json tagName --jq '.[0].tagName'
          if (-not $tag) {
            Write-Host "No hay releases todavia, no hay nada que refrescar."
            exit 0
          }
          Write-Host "Reemplazando el .exe de $tag por uno con yt-dlp al dia"
          gh release upload "$tag" "dist\$env:APP_NAME.exe" --clobber
